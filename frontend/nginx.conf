# nginx serves the built dashboard and forwards API calls to the backend.
server {
    listen 80;
    root /usr/share/nginx/html;

    # Security headers for the dashboard pages.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; connect-src 'self'" always;

    # /api/... goes to the API container (its name in docker-compose.yml is "api").
    location /api/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Request-ID $request_id;
    }

    # Built files have content hashes in their names, so they can be cached for long.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Single-page app: every other path (e.g. /incidents/123) serves index.html,
    # and React Router shows the right page in the browser.
    location / {
        try_files $uri /index.html;
    }
}
