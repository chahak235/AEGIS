# Continuous Integration: GitHub runs these checks on every push and pull request.
# A red X on GitHub means something broke; click it to see which step and why.

name: CI

on:
  push:
    branches: [main]
  pull_request:

# The workflow only needs to READ the code (least privilege).
permissions:
  contents: read

jobs:
  backend:
    name: Backend (lint + tests)
    runs-on: ubuntu-latest
    # A real PostgreSQL just for this run; thrown away afterwards.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: aegis
          POSTGRES_PASSWORD: aegis_test_only
          POSTGRES_DB: aegis_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U aegis -d aegis_test"
          --health-interval 2s --health-timeout 3s --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql://aegis:aegis_test_only@localhost:5432/aegis_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - name: Install dependencies
        run: pip install -r backend/requirements-dev.txt
      - name: Lint (ruff)
        run: ruff check backend ml
      - name: Tests (pytest, including database tests)
        run: python -m pytest -q
      - name: Database migrations match the models
        working-directory: backend
        env:
          DATABASE_URL: ${{ env.TEST_DATABASE_URL }}
        run: alembic check

  frontend:
    name: Frontend (types + tests + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  docker:
    name: Docker images build
    runs-on: ubuntu-latest
    needs: [backend, frontend]   # only bother if the code itself is good
    steps:
      - uses: actions/checkout@v4
      - name: Build API image
        run: docker build -t aegis-api ./backend
      - name: Build dashboard image
        run: docker build -t aegis-web ./frontend
      - name: Smoke test the full stack
        env:
          POSTGRES_PASSWORD: ci-only-password
          JWT_SECRET: ci-only-secret-0123456789-0123456789
          GRAFANA_ADMIN_PASSWORD: ci-only
        run: |
          docker compose --profile app up -d --build
          for i in $(seq 1 60); do
            curl -fsS http://localhost:8000/health/ready && break
            sleep 2
          done
          curl -fsS http://localhost:8000/health/ready
          curl -fsS http://localhost:8080/ | grep -q "<title>AEGIS</title>"
          # Through nginx to the API, without logging in: must be refused (401).
          test "$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8080/api/v1/rules)" = "401"
          docker compose --profile app logs api | tail -20
          docker compose --profile app down -v
