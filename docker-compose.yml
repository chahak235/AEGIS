# Services that run in Docker for local development.
# Start:  docker compose up -d      Stop:  docker compose down
# (or press the play / stop buttons in Docker Desktop -> Containers)

services:
  # A throw-away PostgreSQL used ONLY by the automated tests.
  # The real app data stays in Neon and is never touched by tests.
  test-db:
    image: postgres:16
    environment:
      POSTGRES_USER: aegis
      POSTGRES_PASSWORD: aegis_test_only   # local test box, not a real secret
      POSTGRES_DB: aegis_test
    ports:
      - "5433:5432"   # 5433 on your PC, so it never clashes with another PostgreSQL on 5432
    tmpfs:
      - /var/lib/postgresql/data   # keep data in memory: fast, and wiped on every restart
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aegis -d aegis_test"]
      interval: 2s
      timeout: 3s
      retries: 15
